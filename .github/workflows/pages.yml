name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Run public launch preflight
        run: |
          node tools/validate_external_live_packet.js --template-ok
          node tools/preflight_public_launch.js

      - name: Build static bundle
        shell: bash
        run: |
          mkdir -p _site/tools
          cp public.html _site/index.html
          cp public.js public-config.js public-ama-answers.js styles.css EXTERNAL_LIVE_PACKET.template.json PUBLIC_AMA_QUEUE.template.json PUBLIC_AMA_ANSWERS.template.json REVIEWER_CANDIDATE_TRACKER.template.json REVENUE_SETUP_EVIDENCE_INDEX.template.json _site/
          cp *.md _site/
          cp tools/strange_research_gate.py tools/reactive_research_tools_cors.patch _site/tools/
          cp tools/google_apps_script_order_intake.gs _site/tools/
          cp tools/draft_reviewer_candidate_tracker.js _site/tools/
          cp tools/draft_revenue_setup_evidence_index.js _site/tools/
          cp tools/draft_public_ama_queue.js _site/tools/
          cp tools/export_public_ama_answers.js _site/tools/
          cp tools/validate_external_live_packet.js _site/tools/
          cp tools/validate_public_ama_queue.js _site/tools/
          cp tools/validate_reviewer_candidate_tracker.js _site/tools/
          cp tools/validate_revenue_setup_evidence_index.js _site/tools/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
