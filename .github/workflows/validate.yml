name: Validate static site

on:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check JavaScript syntax
        run: |
          node --check public-config.js
          node --check public.js
          node --check script.js
          node --check tools/preflight_public_launch.js
          node --check tools/audit_company_functionality.js
          node --check tools/draft_reviewer_candidate_tracker.js
          node --check tools/draft_revenue_setup_evidence_index.js
          node --check tools/draft_public_ama_queue.js
          node --check tools/export_public_ama_answers.js
          node --check tools/validate_external_live_packet.js
          node --check tools/validate_public_ama_queue.js
          node --check tools/validate_reviewer_candidate_tracker.js
          node --check tools/validate_revenue_setup_evidence_index.js

      - name: Run Python tool tests
        run: |
          python -m unittest discover -s tests

      - name: Run public launch preflight
        run: |
          node tools/validate_external_live_packet.js --template-ok
          node tools/export_public_ama_answers.js --template-ok
          node tools/validate_public_ama_queue.js --template-ok
          node tools/validate_reviewer_candidate_tracker.js --template-ok
          node tools/validate_revenue_setup_evidence_index.js --template-ok
          node tools/preflight_public_launch.js
